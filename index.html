<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Трекер привычек: серии, тепловая карта, статистика. Работает офлайн." />
    <title>Трекер привычек</title>
    <script>
      // Применяем тему до отрисовки, чтобы не было вспышки светлого фона.
      try {
        var raw = localStorage.getItem('habit-tracker:data');
        var t = raw ? JSON.parse(raw).settings.theme : 'system';
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
